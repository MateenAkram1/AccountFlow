[project]
name = "accountflow-api"
version = "0.1.0"
description = "AccountFlow OS API — meeting-to-action agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "google-genai>=1.0.0",
    "deepgram-sdk>=4.0.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "pypdf>=5.1.0",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.0",
    "PyJWT>=2.9.0",
    "libsql>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.8.0",
]

[project.scripts]
accountflow = "accountflow.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: live API tests (require keys)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["accountflow"]

[tool.vercel]
entrypoint = "accountflow.main:app"
