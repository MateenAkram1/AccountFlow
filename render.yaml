services:
  - type: web
    name: accountflow-api
    runtime: python
    plan: free
    region: singapore
    rootDir: apps/api
    buildCommand: pip install -e .
    startCommand: uvicorn accountflow.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:///./data/accountflow.db
      - key: LLM_PROVIDER
        value: mock
      - key: STT_PROVIDER
        value: mock
      - key: INTEGRATIONS_MOCK
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CREDENTIALS_FERNET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
