services:
  - type: web
    name: accountflow-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -e .
    startCommand: uvicorn accountflow.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: STT_PROVIDER
        value: deepgram
      - key: INTEGRATIONS_MOCK
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./data/accountflow.db
